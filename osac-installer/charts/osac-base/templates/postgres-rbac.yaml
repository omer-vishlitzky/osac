{{- if .Values.sharedPostgres.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osac-shared-postgres-manager
  labels:
    {{- include "osac-base.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["postgres-admin-client-cert"]
  verbs: ["get"]
{{- end }}
