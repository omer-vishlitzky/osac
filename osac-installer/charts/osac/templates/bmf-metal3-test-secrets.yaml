{{- if and .Values.bmf.enabled .Values.bmf.testBackend.metal3.enabled }}
# Kind/IT only: seeds osac-inventory-config/osac-management-config pointed at the
# metal3 backend, so the BMF manager can start without a real OpenStack/Ironic
# deployment. Fake BareMetalHost objects (see bare-metal-fulfillment-operator's
# test/integration suite) stand in for what a real Metal3 BareMetalOperator/Ironic
# would otherwise manage. Never enabled outside values/kind -- this chart is also
# used for real installs, where these Secrets must be created with real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bmf.secrets.inventoryConfig }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
stringData:
  inventory.yaml: |
    name: metal3-inventory
    type: metal3
    hostClass: metal3
    options:
      metal3:
        namespace: {{ .Values.bmf.testBackend.metal3.namespace | default .Release.Namespace | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bmf.secrets.managementConfig }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
stringData:
  management.yaml: |
    name: metal3-management
    type: metal3
    options:
      metal3:
        namespace: {{ .Values.bmf.testBackend.metal3.namespace | default .Release.Namespace | quote }}
{{- end }}
