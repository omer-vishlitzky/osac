{{- if .Values.keycloak.enabled }}
# Creates fulfillment-controller-credentials from keycloak-client-secrets.
# Runs as a regular Job (not a hook) so --wait includes it and fulfillment
# pods can mount the secret once this Job completes. The init container
# polls for keycloak-client-secrets which the Keycloak init container creates.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-create-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-create-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [keycloak-client-secrets, fulfillment-controller-credentials]
  verbs: [get]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-create-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-create-creds
subjects:
- kind: ServiceAccount
  name: osac-create-creds
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: osac-create-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: osac-create-creds
      initContainers:
      - name: wait-for-keycloak-secrets
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            echo "Waiting for keycloak-client-secrets..."
            for i in $(seq 1 120); do
              if oc get secret keycloak-client-secrets -n {{ .Release.Namespace }} -o name 2>/dev/null | grep -q .; then
                echo "keycloak-client-secrets ready."
                exit 0
              fi
              echo "  Attempt ${i}: not ready, retrying in 5s..."
              sleep 5
            done
            echo "ERROR: keycloak-client-secrets not found after 600s"
            exit 1
        env:
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
      containers:
      - name: create-creds
        image: {{ .Values.cliImage }}
        command: ["/bin/bash", "/scripts/create-controller-credentials.sh"]
        env:
        - name: HOME
          value: /tmp
        - name: KEYCLOAK_NAMESPACE
          value: {{ .Release.Namespace }}
        - name: OSAC_NAMESPACE
          value: {{ .Release.Namespace }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: osac-keycloak-hook-scripts
          defaultMode: 0755
{{- end }}
