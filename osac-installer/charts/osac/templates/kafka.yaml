{{- if .Values.metering.enabled }}
{{- $ns := .Values.kafka.clusterNamespace }}
{{- $cluster := .Values.kafka.clusterName }}
{{- $replicas := .Values.kafka.replicas | int }}
{{- $minIsr := min $replicas 2 }}
{{- range list
  (dict "suffix" "lifecycle"    "partitions" 3 "retentionDays" 30)
  (dict "suffix" "heartbeat"    "partitions" 3 "retentionDays" 30)
  (dict "suffix" "inference"    "partitions" 3 "retentionDays" 30)
  (dict "suffix" "corrections"  "partitions" 3 "retentionDays" 30)
  (dict "suffix" "dlq"          "partitions" 1 "retentionDays" 90)
}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: osac.metering.{{ .suffix }}
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ $replicas }}
  config:
    retention.ms: "{{ mul .retentionDays 86400000 }}"
    min.insync.replicas: "{{ $minIsr }}"
    cleanup.policy: delete
---
{{- end }}
{{- end }}
