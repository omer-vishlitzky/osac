# Open Sovereign AI Cloud - Unified Helm Values
# This values file configures all OSAC components via the umbrella chart.

cliImage: quay.io/openshift/origin-cli:4.20.0

# Shared PostgreSQL host for the db-init hook.
dbInit:
  host: "postgres.osac-infra.svc.cluster.local"
  # Prefix for per-instance PG role/database names (e.g. osac_pr1_service).
  # Must not contain dashes (interpolated into SQL as an unquoted identifier).
  pgPrefix: ""
  # When > 0, appends pool_max_conns=N to the workload DB connection URLs.
  poolMaxConns: 0

# Kafka cluster coordinates for per-instance topic/user creation.
kafka:
  enabled: true
  clusterName: osac-kafka
  clusterNamespace: osac-kafka
  replicas: 3

# --- Operator CRDs ---
operatorCrds:
  install: true

# --- Operator ---
operator:
  enabled: true
  # Suffix appended to ClusterRole/ClusterRoleBinding names, for installs
  # where the cluster-scoped RBAC already exists (CRD-only namespace install).
  rbacNameSuffix: ""
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  aap:
    url: ""
    token: ""
    insecureSkipVerify: "true"
    statusPollInterval: "30s"
    templatePrefix: "osac"
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  controllers:
    clusterOrder: true
    computeInstance: true
    tenant: true
    networking: true
    bareMetalInstance: true
    storage: true
  configSecret:
    name: "osac-config"
    optional: true
  hubAccess:
    enabled: false

# --- Fulfillment Service ---
service:
  enabled: true
  variant: openshift
  # [REQUIRED] Hostname for the external API Route (e.g. fulfillment-api-osac.apps.mycluster.example.com)
  externalHostname: ""
  # [REQUIRED] Hostname for the internal API Route (e.g. fulfillment-internal-api-osac.apps.mycluster.example.com)
  internalHostname: ""
  images:
    service: ghcr.io/osac-project/fulfillment-service:latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    envoy: ghcr.io/osac-project/envoy:v1.33.0
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    issuerUrl: "https://REPLACE_ME"
    controllerCredentials: []
  idp:
    provider: keycloak
    url: ""
    credentials: []
  database:
    connection: []
    # Example:
    # connection:
    # - secret:
    #     name: osac-db-config
    #     items:
    #     - key: url
    #       param: url
  log:
    level: info
    headers: false
    bodies: false
  vault:
    endpoint: ""
    namespace: osac
    kvMountPath: secret
    lifecycleRole: ""
    lifecycleMountPath: "jwt"
    keycloakClientId: ""
    keycloakIssuerUrl: ""
    keycloakAudience: "osac-api"
    caBundle:
      configMap: ""
    credentials: []

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
      controller:
        disabled: false
      hub:
        disabled: true
      lightspeed:
        disabled: true
      noLog: true
      redisMode: standalone
      routeTlsTerminationMechanism: Edge
      imagePullPolicy: IfNotPresent
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    backoffLimit: 15
    readinessConsecutiveSuccesses: 3
    # Shared-AAP remote mode: bootstrap config-as-code against an AAP instance
    # living in another namespace/cluster. Skips the wait-for-admin-secret
    # init container and reads the admin password from adminPasswordSecret.
    remote: false
    adminPasswordSecret: ""
    # The shared AAP is already licensed; pool installs skip the subscription
    # playbook.
    skipSubscription: false
    gateway:
      hostname: ""
    controller:
      hostname: ""
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: ""
    projectGitUri: ""
    projectGitBranch: ""
    importAgentsEnabled: false
    importBcmAgentsEnabled: false
    # Remote-mode AAP connection settings (rendered into the config-as-code-ig
    # Secret only when set).
    aapHostname: ""
    aapUsername: ""
    aapValidateCerts: ""
    aapPrefix: ""
    aapOrganizationName: ""
    aapProjectName: ""
    # Pool installs must not leave recurring project-sync/config-as-code
    # schedules polling a shared AAP; false removes those schedules.
    projectSyncEnabled: true
    configAsCodeEnabled: true
  remote:
    # Point an install at a shared AAP instance managed elsewhere.
    rbacEnabled: false
    # ServiceAccount the shared AAP controller pods use (required, together
    # with controllerNamespace, when rbacEnabled is true).
    controllerServiceAccount: ""
    controllerNamespace: ""
    # URL of the shared AAP gateway, e.g. http://osac-aap.osac-aap.svc.cluster.local
    gatewayURL: ""
    apiTokenSecret:
      name: ""
      namespace: ""
  importAgents:
    servers: []
  importBcmAgents:
    cert: ""
    key: ""
  instanceGroups:
    clusterFulfillment:
      enabled: false
      config:
        NETWORK_CLASS: ""
        NETWORK_STEPS_COLLECTION: ""
        DNS_CLASS: ""
        DNS_ZONE: ""
        NETRIS_CONTROLLER_URL: ""
        NETRIS_USERNAME: ""
        NETRIS_SITE_ID: ""
        NETRIS_TENANT_ID: ""
        NETRIS_TENANT_NAME: ""
        NETRIS_MGMT_VPC_ID: ""
        NETRIS_MGMT_VPC_NAME: ""
        NETRIS_RESOURCE_CLASS_MAP: ""
        SERVER_SSH_BASTION_HOST: ""
        SERVER_SSH_BASTION_USER: ""
        SERVER_SSH_USER: ""
        SERVER_MGMT_ROUTE_DESTINATION: ""
        SERVER_MGMT_ROUTE_GATEWAY: ""
        EXTERNAL_ACCESS_BASE_DOMAIN: ""
        EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS: ""
        EXTERNAL_ACCESS_API_INTERNAL_NETWORK: ""
        HOSTED_CLUSTER_BASE_DOMAIN: ""
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: ""
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: ""
        PARKING_VNET_NAME: ""
        IMPORT_AGENTS_NAMESPACE: ""
        IMPORT_AGENTS_INFRAENV_NAME: ""
        IMPORT_AGENTS_PULL_SECRET_NAME: ""
        IMPORT_AGENTS_DISABLE_BMC_CERT_VERIFICATION: ""
        BCM_API_URL: ""
        BCM_VALIDATE_CERTS: "true"
        BCM_DISABLE_BMC_CERT_VERIFICATION: "false"
      secret:
        NETRIS_PASSWORD: ""
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
        SERVER_SSH_KEY: ""
        SERVER_SSH_BASTION_KEY: ""
    networkFulfillment:
      enabled: false
      config:
        NETRIS_CONTROLLER_URL: ""
        NETRIS_USERNAME: ""
        NETRIS_SITE_ID: ""
        NETRIS_TENANT_ID: ""
        NETRIS_TENANT_NAME: ""
      secret:
        NETRIS_PASSWORD: ""
    storageFulfillment:
      enabled: false
      config:
        STORAGE_SNAPSHOTS_ENABLED: ""
      secret:
        VAST_ENDPOINT: ""
        VAST_USERNAME: ""
        VAST_PASSWORD: ""
    publishTemplates:
      enabled: true
      config:
        OSAC_TEMPLATE_COLLECTIONS: "osac.templates"
        OSAC_FULFILLMENT_SERVICE_URI: "https://fulfillment-internal-api:8001"

# --- UI ---
ui:
  enabled: true
  externalHostname: ""
  api:
    fulfillment:
      url: https://fulfillment-internal-api:8001
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    oidcClientId: osac-ui
    certs:
      caBundle:
        configMap: ca-bundle
  log:
    level: info
  images:
    ui: ghcr.io/osac-project/osac-ui:latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml

# --- Metering ---
metering:
  enabled: false
  image:
    repository: ghcr.io/osac-project/metering-service
    tag: latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    pullPolicy: Always
  # Suffix for Role/RoleBinding names in the shared Kafka namespace.
  rbacNameSuffix: ""
  # When false (shared stamped install), the metering chart skips
  # KafkaTopic/KafkaUser creation for the shared Kafka cluster.
  kafka:
    provision: true

# --- CSI Driver ---
csiDriver:
  enabled: false
  image:
    repository: ghcr.io/osac-project/osac-csi-driver
    tag: latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    pullPolicy: Always

# --- CSI Backends ---
csiBackends: {}

# --- Bare Metal Fulfillment Operator CRDs ---
bmfCrds:
  install: true

# --- Bare Metal Fulfillment Operator ---
bmf:
  enabled: true
  # Suffix appended to ClusterRole/ClusterRoleBinding names, for installs
  # where the cluster-scoped RBAC already exists (CRD-only namespace install).
  rbacNameSuffix: ""
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
    pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ""
  secrets:
    inventoryConfig: "osac-inventory-config"
    managementConfig: "osac-management-config"
    osClouds: "osac-os-clouds"
  # Kind/IT only -- see templates/bmf-metal3-test-secrets.yaml
  testBackend:
    metal3:
      enabled: false
      namespace: ""
      # Names for the fake Secrets this seeds -- deliberately a separate field
      # from bmf.secrets.* (the real-credential defaults) rather than derived
      # from them, since values/kind/osac.yaml also overrides bmf.secrets.* to
      # point at these same names, and deriving one from the other here would
      # be circular. See templates/bmf-metal3-test-secrets.yaml.
      secretNames:
        inventoryConfig: "osac-inventory-config-metal3-test"
        managementConfig: "osac-management-config-metal3-test"
  configMaps:
    profiles: "osac-profiles"
  env:
    aapInsecureSkipVerify: "true"
  bcm:
    enabled: false
    url: ""
    cert: ""
    key: ""
    caCert: ""
    insecureSkipVerify: false
    hostClass: "bcm"
    bmhNamespace: ""
  metal3:
    enabled: false
    namespace: ""
    hostClass: "metal3"

# --- Validation hooks ---
validation:
  enabled: true

# --- MetalLB Address Pool ---
metallb:
  enabled: false
  addressCIDR: "192.168.40.0/24"

hubAccess:
  enabled: false

bundledVault:
  enabled: false
  devRootToken: ""
  image: "ghcr.io/openbao/openbao:2.6.1"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# --- Per-install Keycloak (pool mode) ---
keycloak:
  # Deploy a dedicated Keycloak into the release namespace (pool mode) instead
  # of using the shared osac-infra Keycloak. Off by default -- default full
  # installs keep using the shared instance from Phase 2, byte-identical.
  enabled: false
  # Seed known, non-random passwords for the realm's built-in tenant/test
  # users (admin, user, tenant1_admin, ...). Dev/CI pool runs only.
  devFixtures: true
  # [REQUIRED when enabled] Public Route host for this install's Keycloak
  # (e.g. keycloak-pool-abc.apps.example.com). Enforced in the template via
  # `required`; a pool install without it fails loud.
  routeHost: ""
  # Internal hostname set as KC_HOSTNAME and on the TLS cert. Defaults to
  # keycloak.<release-namespace>.svc.cluster.local.
  internalHost: ""
  realmOverwrite: true
  adminUsername: admin
  adminPassword: admin
  defaultUserPassword: foobar
  route:
    publicIngress: false
  # Resource requests/limits for the Keycloak container. The shared
  # osac-infra Keycloak runs without limits; pool installs need them so a
  # per-install Keycloak cannot starve the cluster (accepted ops exemption
  # from the byte-diff contract).
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Resource requests/limits for the bundled PostgreSQL container.
  postgres:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  images:
    keycloak: quay.io/keycloak/keycloak:26.6.4
    postgres: quay.io/sclorg/postgresql-18-c10s@sha256:6be2c9d855f06fb665257a6b0911676a38d740be7022cc61acee1c99a832b1b2

clusterVersions:
  enabled: false
  versions: []
  # Example:
  # enabled: true
  # versions:
  # - version: "4.20.0"
  #   image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
  # - version: "4.22.0"
  #   image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
  #   default: true

lvms:
  # Register LVMS as a local StorageBackend + StorageTier in the fulfillment service
  # after install. For CI/development environments only — production deployments
  # should use their own storage operators (Ceph, Pure, VAST, etc.).
  enabled: false

networkClass:
  # Create a NetworkClass in the fulfillment service after install. At least one of
  # k8sManager/fabricManager must be set when enabled — the corresponding manager
  # must already be registered via operator.networkManagers (see that chart's values).
  enabled: false
  # [REQUIRED when enabled] Human-friendly short title — the fulfillment service
  # rejects NetworkClass creation without one (NC-VAL-02).
  title: ""
  description: ""
  k8sManager: ""
  fabricManager: ""
  isDefault: true
  defaults:
    # Tenant-onboarding defaults: without these, this being the default NetworkClass
    # does not auto-create a VirtualNetwork/Subnet/SecurityGroup for new tenants, and
    # ComputeInstance creation without explicit network_attachments will fail.
    virtualNetworkIPv4CIDR: "10.200.0.0/16"
    subnetIPv4CIDR: "10.200.0.0/20"
    enableNatGateway: false
    egressRules:
    - protocol: PROTOCOL_ALL
      ipv4Cidr: "0.0.0.0/0"
  # Example (k8s-only profile):
  # enabled: true
  # title: "K8s-only networking"
  # k8sManager: "k8s_only"
