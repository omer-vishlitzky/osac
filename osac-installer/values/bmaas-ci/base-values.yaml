# BMaaS CI — base layer values (phases 1-3: operators + prereqs + base)
certManager:
  enabled: true
trustManager:
  enabled: true
caIssuer:
  enabled: true
keycloak:
  enabled: true
aapOperator:
  enabled: true
lvms:
  enabled: true
metallb:
  enabled: false
cnv:
  enabled: false
mce:
  enabled: false

aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: "ghcr.io/osac-project/osac-aap:latest"
    projectGitUri: "https://github.com/omer-vishlitzky/osac"
    projectGitBranch: "feat/base-workload-chart-split"

sharedPostgres:
  enabled: true
  adminUser: "osac_admin"

certs:
  issuerRef:
    kind: ClusterIssuer
    name: default-ca
  caBundle:
    configMap: ca-bundle

validation:
  enabled: true
