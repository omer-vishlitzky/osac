# Pool instance values -- one OSAC instance stamped onto a shared cluster
# that was installed with a base profile. Deploy with:
#   make install-osac PLATFORM=openshift PROFILE=pool NS=<run-ns>
# (PROFILE=pool resolves to this file). Namespace-dependent values and the
# per-run RBAC/DB suffixes are passed as --set overrides by the stamping
# pipeline, not baked in here.

# --- CRD gates ---
# Cluster-scoped CRDs already exist from the stamped install; per-run
# releases must not touch them.
operatorCrds:
  install: false
bmfCrds:
  install: false

# --- CSI Driver ---
# The stamped cluster already runs the CSI driver (osac-csi namespace).
csiDriver:
  enabled: false

# --- Operator ---
operator:
  # Cluster-scoped RBAC already exists from the stamped install.
  # Override per run: --set operator.rbacNameSuffix=<run>
  rbacNameSuffix: ""
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest
    pullPolicy: Always
  provisioning:
    provider: "aap"
  aap:
    insecureSkipVerify: "true"
    # Talks to the shared stamped AAP. Override per run:
    #   --set operator.aap.url=$AAP_GATEWAY_URL
    #   --set operator.aap.templatePrefix=osac-<runid>
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  controllers:
    clusterOrder: false
    computeInstance: true
    bareMetalInstance: false
    tenant: true
    networking: true
    storage: true
    volume: true
  # The console-proxy APIService is registered cluster-wide by the stamped
  # install; a second registration would conflict, so it stays off.
  consoleProxy:
    disabled: true
  hubAccess:
    enabled: true

# --- Fulfillment Service ---
service:
  externalHostname: ""  # Set dynamically by make install-osac
  internalHostname: ""  # Set dynamically by make install-osac
  variant: openshift
  images:
    service: ghcr.io/osac-project/fulfillment-service:main
    envoy: ghcr.io/osac-project/envoy:v1.33.0
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    issuerUrl: ""  # --set via KEYCLOAK_HOST env (Makefile); blank fails rendering
    emergencyServiceAccounts:
    - admin
    - osac-operator
    - osac-operator-controller-manager
    - template-publisher
    - osac-metering
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    provider: keycloak
    url: ""  # --set via KEYCLOAK_HOST env (Makefile); blank fails rendering
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  log:
    level: debug
  vault:
    # Bundled per-run OpenBao (bundledVault below).
    # Override per run: --set service.vault.endpoint=https://openbao.<NS>.svc.cluster.local:8200
    endpoint: ""
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakIssuerUrl: ""  # --set via KEYCLOAK_HOST env (Makefile); blank fails rendering
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-secret
          param: client-secret

# --- UI ---
ui:
  enabled: true
  images:
    ui: ghcr.io/osac-project/osac-ui:latest
  api:
    fulfillment:
      certs:
        caBundle:
          configMap: ca-bundle
  auth:
    certs:
      caBundle:
        configMap: ca-bundle

# --- AAP ---
aap:
  aap:
    instance:
      # The shared stamped AAP instance is reused; no per-run AAP operator.
      enabled: false
  bootstrap:
    # Runs config-as-code against the shared AAP with this run's prefix.
    # The bootstrap pod's downward-API NAMESPACE is baked into every job
    # template's pod spec (metadata.namespace), so AAP job pods land here.
    enabled: true
    remote: true
    skipSubscription: true
    # The shared AAP admin password, copied into this namespace by the
    # workflow before helm install (the secret name matches the stamped
    # AAP_ADMIN_SECRET_NAME).
    adminPasswordSecret: osac-aap-admin-password
    # gateway.hostname / controller.hostname: --set by the workflow from
    # AAP_GATEWAY_HOSTNAME / AAP_CONTROLLER_HOSTNAME.
  configAsCode:
    # --set by the workflow: aapHostname=$AAP_GATEWAY_URL,
    # aapUsername=admin, aapValidateCerts=false, aapPrefix=osac-<runid>,
    # aapOrganizationName=osac-<runid>-org, projectGitUri/Branch=the PR
    # checkout. No defaults here: a pool install that forgets them must fail.
    projectSyncEnabled: false
    configAsCodeEnabled: false
  remote:
    rbacEnabled: true
    # controllerServiceAccount / controllerNamespace / gatewayURL: --set by
    # the workflow. rbacEnabled=true without them fails helm rendering (the
    # chart requires them together), so a misconfigured workflow is loud.
  apiToken:
    # No create-api-token hook against the shared AAP; the workflow writes
    # the shared AAP token into this namespace as Secret
    # osac-aap-api-token before helm install.
    create: false

# --- Per-install Keycloak ---
keycloak:
  enabled: true
  # routeHost is --set by the workflow via the Makefile KEYCLOAK_HOST env
  # (which also re-points service.auth.issuerUrl / idp.url / vault issuer).
  # devFixtures defaults to true: realm users are seeded with the fixed
  # passwords that OSAC_JWT_PASSWORD / OSAC_KEYCLOAK_ADMIN_PASSWORD carry.

# --- Validation ---
validation:
  enabled: true

# --- Bare Metal Fulfillment Operator ---
bmf:
  enabled: false
  # Cluster-scoped RBAC already exists from the stamped install.
  # Override per run: --set bmf.rbacNameSuffix=<run>
  rbacNameSuffix: ""

# --- Hub Access ---
hubAccess:
  enabled: true

# --- Metering ---
metering:
  enabled: true
  reconciliation:
    interval: "5m"
  # Role/RoleBinding names in the shared Kafka namespace collide across
  # runs; the stamped install owns the unsuffixed ones.
  # Override per run: --set metering.rbacNameSuffix=<run>
  rbacNameSuffix: ""
  # The shared stamped Kafka cluster already has its topics/users; per-run
  # releases must not create KafkaTopic/KafkaUser resources (coordinates
  # still point at the shared cluster via the default kafka.* values).
  kafka:
    provision: false
  # Echo adapter -- test/development tool only, not needed on pool runs.
  echoAdapter:
    enabled: false
  database:
    connection:
    - secret:
        name: osac-db-metering-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-metering-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert

# --- Shared PostgreSQL ---
dbInit:
  # Per-run PG role/database prefix on the shared stamped PostgreSQL.
  # Override per run: --set dbInit.pgPrefix=<run> (no dashes -- interpolated
  # into SQL as an unquoted identifier).
  pgPrefix: ""
  # Cap connection pooling so parallel pool runs cannot exhaust the shared
  # PostgreSQL's max_connections.
  poolMaxConns: 0

# --- Bundled OpenBao ---
bundledVault:
  # Per-run Vault-compatible store (dev mode -- see service.vault.endpoint).
  enabled: true
  devRootToken: "dev-root-token"

# --- LVMS StorageBackend registration ---
lvms:
  enabled: true
