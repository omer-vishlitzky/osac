# VMaaS CI vcluster overlay -- layered on top of instance.yaml when VCLUSTER=true.
# Overrides that adapt OSAC to run inside a vcluster with host-cluster
# infrastructure (Kafka, Keycloak Routes, shared PostgreSQL).

# --- Kafka overrides ---
# Inside the vcluster, Kafka is not local -- connect to the host cluster's
# Strimzi Kafka via the synced service or external bootstrap address.
kafka:
  clusterName: osac-kafka
  clusterNamespace: osac-kafka
  # The vcluster cannot create KafkaTopics/KafkaUsers on the host -- those
  # are managed by the multi-instance Helm templates on the host side.
  # Override the bootstrap to point at the host's Kafka service.
  bootstrapOverride: "osac-kafka-kafka-bootstrap.osac-kafka.svc.cluster.local:9093"

# --- Cert overrides ---
# The vcluster runs its own cert-manager with a 3-layer PKI chain
# (root -> intermediate -> leaf). The ClusterIssuer and ca-bundle are
# created by vcluster.sh create, matching these names.
service:
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle

# --- AAP overrides ---
# AAP runs on the host cluster. The vcluster's OSAC operator reaches AAP
# via the host's Route (not a cluster-local service).
aap:
  aap:
    instance:
      # AAP instance lives on the host, not inside the vcluster.
      enabled: false
  bootstrap:
    enabled: false

# --- Operator overrides ---
operator:
  # No hub-access inside vcluster -- the host handles HCP coordination.
  hubAccess:
    enabled: false
