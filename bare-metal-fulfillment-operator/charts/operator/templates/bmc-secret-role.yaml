{{- /*
Namespace-scoped access to BMC credential Secrets.

The operator only reads and manages BMC credential Secrets in the Metal3
(BMH) namespace, so this grant is a namespaced Role + RoleBinding there —
not a cluster-wide rule on the manager ClusterRole. Only created when the
BCM backend is enabled and a BMH namespace is configured.
*/ -}}
{{- if and .Values.bcm.enabled .Values.bcm.bmhNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ .Values.bcm.bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ .Values.bcm.bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "bare-metal-fulfillment-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
