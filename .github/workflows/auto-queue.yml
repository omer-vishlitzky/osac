---
name: auto-queue

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"

jobs:
  enable-auto-merge:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check repo collaborator
        id: org-check
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          author="${{ github.event.pull_request.user.login }}"
          echo "author=$author"
          echo "draft=${{ github.event.pull_request.draft }}"
          if gh api "repos/${{ github.repository }}/collaborators/$author"; then
            echo "org_member=true"
            echo "org_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "org_member=false"
            echo "org_member=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check blocking labels
        if: steps.org-check.outputs.org_member == 'true'
        id: label-check
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "labels=$LABELS"
          blocked=false
          for label in "do-not-merge/hold" "needs-rebase"; do
            if echo "$LABELS" | jq -e "index(\"$label\")" > /dev/null; then
              echo "Blocking label found: $label"
              blocked=true
            fi
          done
          echo "blocked=$blocked"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: >-
          github.event.pull_request.draft == false
          && steps.org-check.outputs.org_member == 'true'
          && steps.label-check.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --auto --rebase

      - name: Disable auto-merge
        if: >-
          steps.org-check.outputs.org_member == 'true'
          && steps.label-check.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --disable-auto

  requeue-eligible-prs:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable auto-merge on eligible PRs
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          echo "Scanning for eligible PRs without auto-merge..."
          gh pr list --repo "${{ github.repository }}" --state open --json number,isDraft,labels,autoMergeRequest --jq '
            .[] | select(
              .isDraft == false
              and .autoMergeRequest == null
              and ([.labels[].name] | contains(["lgtm","approved","jira/valid-reference"]))
              and ([.labels[].name] | any(. == "do-not-merge/hold" or . == "needs-rebase") | not)
            ) | .number
          ' | while read -r pr; do
            echo "Re-enabling auto-merge on PR #$pr"
            gh pr merge "$pr" --repo "${{ github.repository }}" --auto --rebase || echo "Failed to enable auto-merge on PR #$pr"
          done
          echo "Scan complete."
