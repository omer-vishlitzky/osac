---
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml
    permissions:
      contents: read
      issues: write

  check-pr:
    uses: ./.github/workflows/check-pull-request.yaml

  check-generated-code:
    uses: ./.github/workflows/check-generated-code.yaml

  check-floating-tags:
    uses: ./.github/workflows/check-floating-tags.yaml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml

  helm-lint:
    uses: ./.github/workflows/helm-lint.yaml

  ansible-lint:
    uses: ./.github/workflows/ansible-lint.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml

  label-gate:
    uses: ./.github/workflows/label-gate.yml
    with:
      caller-event: ${{ github.event_name }}

  e2e-vmaas:
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    secrets: inherit

  e2e-bmaas:
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    secrets: inherit

  e2e-caas:
    uses: ./.github/workflows/e2e-caas-full-install.yml
    secrets: inherit

  check:
    if: always()
    needs: [pre-commit, check-pr, check-generated-code, check-floating-tags, unit-tests, integration-tests, helm-lint, ansible-lint, codeql, dependency-review, label-gate, e2e-vmaas, e2e-bmaas, e2e-caas]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e '
            to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0
          '
