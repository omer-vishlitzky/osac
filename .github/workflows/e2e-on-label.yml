# OSAC-3370: start expensive e2e when /e2e-ready is applied.
# Listener must live here (labeled / workflow_dispatch fire in this repo).
# Start logic is the reusable in osac-test-infra (workflow filenames differ).
# GITHUB_TOKEN label events do not start other workflows, so the slash-command
# handler dispatches this file after applying e2e-ready.
# test-infra e2e-start dispatches trusted base-branch workflows with the
# current synthetic merge ref as source/test inputs. Native full-install
# e2e-*-gate jobs report; until then required gates stay pending. e2e-ready is
# the single cost and authorization gate.
name: E2E on unlock label

on:
  pull_request_target:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to unlock
        required: true
        type: string
      trigger_label:
        description: Unlock label that was applied
        required: false
        default: e2e-ready
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-start-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  start-e2e:
    permissions:
      actions: write
      checks: write
      contents: read
      issues: read
      pull-requests: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'e2e-ready'
    uses: osac-project/osac-test-infra/.github/workflows/e2e-on-label.yml@eac6a761704ae4f45d9bb9326375122803854a13
    with:
      pr_number: ${{ github.event.inputs.pr_number || format('{0}', github.event.pull_request.number) }}
      trigger_label: ${{ github.event.label.name || github.event.inputs.trigger_label || 'e2e-ready' }}
      event_head_sha: ${{ github.event.pull_request.head.sha }}
      workflows: e2e-vmaas-full-install.yml,e2e-bmaas-full-install.yml,e2e-caas-full-install.yml
