{{- /*
Default meter definitions, shipped as rule revision 0001. Revisions are
immutable: a change is a new ConfigMap with the next number and a future
effective_at, never an edit of this one. The admission policy below blocks
deleting or changing it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-metering-rules-0001
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
    osac.openshift.io/metering-rules: ""
immutable: true
data:
  effective_at: "1970-01-01T00:00:00Z"
  meters.yaml: |
{{ .Files.Get "rules/0001-meters.yaml" | indent 4 }}
---
{{- /*
Rule revisions are the record of what was billed under which rules. Deleting
one would make metering refuse to start, and editing one would silently
change past usage, so both are denied. Requires Kubernetes 1.30 or later.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "osac-metering.fullname" . }}-protect-rules
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE", "UPDATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: only-rule-revisions
      expression: "object.metadata.name.startsWith('osac-metering-rules-')"
  validations:
    - expression: "false"
      message: "metering rule revisions are immutable and must not be deleted or changed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "osac-metering.fullname" . }}-protect-rules
  labels:
    {{- include "osac-metering.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
spec:
  policyName: {{ include "osac-metering.fullname" . }}-protect-rules
  validationActions: ["Deny"]
