image:
  repository: ghcr.io/osac-project/metering-service
  tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  pullPolicy: Always

# Global values are supplied by the umbrella chart. The service validates the
# identity at startup when this chart is installed standalone.
global:
  osacDeploymentId: ""
  fulfillmentTrust:
    enabled: false
  # Issuer URL is read from this ConfigMap's FULFILLMENT_ISSUER_URL key.
  # The installer creates the default ConfigMap; standalone installs must
  # create it in the release namespace or set this to another existing ConfigMap.
  meteringFulfillmentIssuerConfigMapName: osac-metering-fulfillment-config

# Fulfillment address is auto-derived from release namespace.
# Override fulfillment.address for cross-namespace/cross-cluster (OSAC-3537).

database:
  connection: []

# Heartbeat round interval. One minute by default; each heartbeat is a rated
# transaction in the billing provider, so a longer interval sends fewer of
# them and keeps running totals staler.
heartbeat:
  interval: "60s"

# Rule revisions live as immutable ConfigMaps in this namespace. The chart
# ships revision 0001; a new revision is a new ConfigMap with a future
# effective_at and a metering restart.
rules:
  namespace: ""

certs:
  caBundle:
    configMap: ca-bundle

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Kafka connection and topic naming. Override to point at a different
# Kafka cluster or to prefix topics for per-instance isolation.
# TLS trust uses certs.caBundle (the shared OSAC CA), not the Strimzi cluster CA.
kafka:
  brokers: ""          # default: osac-kafka-kafka-bootstrap.osac-kafka.svc.cluster.local:9093
  clusterName: ""      # default: osac-kafka
  clusterNamespace: "" # default: osac-kafka

# Prefix prepended to all topic names (e.g. "pr101" -> "pr101.osac.metering.lifecycle").
# When set, this chart skips KafkaTopic/KafkaUser creation (the parent chart owns them).

## Echo adapter — test/development tool only, not for production use.
## Enable and configure via environment-specific values (e.g., values/vmaas-ci/values.yaml).
echoAdapter:
  enabled: false
  # image:
  #   repository: ghcr.io/osac-project/metering-echo-adapter
  #   tag: latest
  #   pullPolicy: Always

## M360 adapter — forwards metering events to Monetize360 Usage API.
m360Adapter:
  enabled: false
  image:
    repository: ghcr.io/osac-project/metering-m360-adapter
    tag: latest  # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
    pullPolicy: Always
  m360:
    apiUrl: ""
    apiKeySecret: ""     # name of K8s Secret with key "api-key"
    apiVersion: "v1"
