---
- name: Read management-cluster upstream credential Secret
  vars:
    _credential_secret_name: "{{ item.upstream_credential_secret_name | default(ocp_4_20_ai_maas_upstream_credentials_secret_name) }}"
    _credential_secret_namespace: "{{ item.upstream_credential_secret_namespace | default(ocp_4_20_ai_maas_upstream_credentials_secret_namespace) }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _credential_secret_name }}"
    namespace: "{{ _credential_secret_namespace }}"
    kubeconfig: "{{ (ocp_4_20_ai_maas_management_kubeconfig | default('') | length > 0) | ternary(ocp_4_20_ai_maas_management_kubeconfig | expanduser, omit) }}"
  register: _external_model_upstream_secret
  no_log: true
  when: item.upstream_credential | default('') | length == 0

- name: Fail if referenced upstream credential Secret or key is missing
  vars:
    _credential_secret_name: "{{ item.upstream_credential_secret_name | default(ocp_4_20_ai_maas_upstream_credentials_secret_name) }}"
    _credential_secret_namespace: "{{ item.upstream_credential_secret_namespace | default(ocp_4_20_ai_maas_upstream_credentials_secret_namespace) }}"
    _credential_secret_key: "{{ item.upstream_credential_secret_key | default('') }}"
  ansible.builtin.fail:
    msg: >-
      External model '{{ item.name }}' could not resolve upstream credential from
      Secret {{ _credential_secret_namespace }}/{{ _credential_secret_name }} key
      {{ _credential_secret_key }}.
  when:
    - item.upstream_credential | default('') | length == 0
    - >-
      (_external_model_upstream_secret.resources | length == 0)
      or
      (((_external_model_upstream_secret.resources[0].data | default({})).get(_credential_secret_key, '')) | length == 0)

- name: Add resolved external model entry
  vars:
    _credential_secret_key: "{{ item.upstream_credential_secret_key | default('') }}"
  ansible.builtin.set_fact:
    _resolved_external_models: >-
      {{
        _resolved_external_models + [
          item | combine({
            'upstream_credential': (
              (item.upstream_credential | default(''))
              if (item.upstream_credential | default('') | length > 0)
              else (_external_model_upstream_secret.resources[0].data[_credential_secret_key] | b64decode)
            )
          })
        ]
      }}
  no_log: true
