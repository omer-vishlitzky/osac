{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac-aap.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac-aap.fullname" . }}-read-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "osac-aap.adminPasswordSecret" . }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac-aap.fullname" . }}-read-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac-aap.fullname" . }}-read-admin-secret
subjects:
  - kind: ServiceAccount
    name: {{ include "osac-aap.fullname" . }}-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac-aap.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  # Cumulative across all backoffLimit retries; must exceed both init containers'
  # combined worst-case runtime (see _helpers.tpl) so a stuck attempt exits
  # cleanly instead of being SIGKILLed.
  activeDeadlineSeconds: 8400
  template:
    metadata:
      labels:
        {{- include "osac-aap.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "osac-aap.fullname" . }}-bootstrap
      initContainers:
      {{- /* Remote mode skips the wait-for-admin-secret init container: there
           is no operator-managed local admin secret to wait for --
           bootstrap.adminPasswordSecret names an out-of-band Secret with the
           shared AAP's admin password. */}}
      {{- if not .Values.bootstrap.remote }}
      - name: wait-for-admin-secret
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            {{- include "osac-aap.waitForAdminSecretScript" . | nindent 12 }}
        {{- include "osac-aap.waitForAdminSecretContainerSpec" . | nindent 8 }}
      {{- end }}
      - name: wait-for-aap
        image: {{ .Values.bootstrap.cliImage }}
        command:
          - /bin/bash
          - -c
          - |
            {{- include "osac-aap.waitForAapScript" . | nindent 12 }}
        {{- include "osac-aap.waitForAapContainerSpec" . | nindent 8 }}
      containers:
      - name: bootstrap
        image: {{ .Values.bootstrap.image }}
        {{- /* Remote mode: the published EE image lags the branch under
             test (CI overrides the image; local pool installs do not).
             Clone AAP_PROJECT_GIT_URI@BRANCH and prefer those collections
             so pod_spec_override metadata.namespace and other branch
             fixes actually reach Instance Group creation. Fail closed if
             the git env or NAMESPACE downward API is missing. */}}
        {{- if .Values.bootstrap.remote }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          : "${NAMESPACE:?NAMESPACE downward-API env is required}"
          : "${AAP_PROJECT_GIT_URI:?AAP_PROJECT_GIT_URI is required for remote bootstrap}"
          : "${AAP_PROJECT_GIT_BRANCH:?AAP_PROJECT_GIT_BRANCH is required for remote bootstrap}"
          SRC=/tmp/osac-src
          rm -rf "${SRC}"
          echo "Cloning ${AAP_PROJECT_GIT_URI}@${AAP_PROJECT_GIT_BRANCH} for config-as-code collections"
          git clone --depth 1 --branch "${AAP_PROJECT_GIT_BRANCH}" "${AAP_PROJECT_GIT_URI}" "${SRC}"
          COLLECT="${SRC}/osac-aap/collections"
          VENDOR="${SRC}/osac-aap/vendor"
          test -d "${COLLECT}/ansible_collections/osac/config_as_code"
          export ANSIBLE_COLLECTIONS_PATH="${COLLECT}:${VENDOR}:/usr/share/ansible/collections"
          echo "ANSIBLE_COLLECTIONS_PATH=${ANSIBLE_COLLECTIONS_PATH}"
          echo "NAMESPACE=${NAMESPACE}"
          exec ansible-playbook \
            {{- if not .Values.bootstrap.skipSubscription }}
            osac.config_as_code.subscription \
            {{- end }}
            osac.config_as_code.configure
        {{- else }}
        args:
        - ansible-playbook
        {{- if not .Values.bootstrap.skipSubscription }}
        {{- /* The shared AAP is already licensed by whoever owns it; pool
             installs skip the subscription playbook. */}}
        - osac.config_as_code.subscription
        {{- end }}
        - osac.config_as_code.configure
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ .Values.configAsCode.secret }}
        env:
        - name: AAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "osac-aap.adminPasswordSecret" . }}
              key: password
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config-as-code-manifest-volume
          mountPath: /var/secrets/config-as-code-manifest
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-as-code-manifest-volume
        secret:
          secretName: {{ .Values.configAsCode.manifestSecret }}
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
{{- end }}
