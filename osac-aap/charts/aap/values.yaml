aap:
  instance:
    enabled: true
    name: "osac-aap"
    controller:
      disabled: false
    eda:
      disabled: true
    hub:
      disabled: true
    lightspeed:
      disabled: true
    redisMode: standalone
    routeTlsTerminationMechanism: Edge
    imagePullPolicy: IfNotPresent

bootstrap:
  enabled: true
  image: ghcr.io/osac-project/osac-aap:latest  # PLACEHOLDER -- overwritten at release time by publish-charts.yaml
  cliImage: quay.io/openshift/origin-cli:4.20.0
  backoffLimit: 15
  readinessConsecutiveSuccesses: 3
  # Shared-AAP remote mode: bootstrap config-as-code against an AAP instance
  # living in another namespace/cluster instead of the local one. Skips the
  # wait-for-admin-secret init container (the operator will not create a
  # local admin secret) and reads the admin password from adminPasswordSecret
  # instead. gateway.hostname/controller.hostname override the AAP service
  # hostnames used by the wait-for-aap checks (full FQDN when the shared AAP
  # is in another namespace).
  remote: false
  adminPasswordSecret: ""
  skipSubscription: false
  gateway:
    hostname: ""
  controller:
    hostname: ""

configAsCode:
  manifestSecret: "config-as-code-manifest-ig"
  secret: "config-as-code-ig"
  eeImage: ""
  # Controller's own execution_environment.pull field (always / missing /
  # never). Left empty by default (config-as-code-secret.yaml omits the env
  # var, Ansible side falls back to "always", preserving today's behavior
  # for the shipped mutable :latest default); e2e sets this to "missing"
  # alongside its own eeImage override, since that image only exists in the
  # node's local store and was never pushed to a real registry.
  eeImagePull: ""
  projectGitUri: ""
  projectGitBranch: ""
  importAgentsEnabled: false
  importBcmAgentsEnabled: false
  # Remote-mode AAP connection settings. Empty values are omitted from the
  # config-as-code-ig Secret, so the Ansible defaults (local AAP instance
  # name, osac organization, ...) keep today's behavior.
  aapHostname: ""
  aapUsername: ""
  aapValidateCerts: ""
  aapPrefix: ""
  aapOrganizationName: ""
  aapProjectName: ""
  fulfillmentServiceUri: ""
  # Pool installs must not leave recurring project-sync/config-as-code
  # schedules polling a shared AAP; setting these to false renders
  # OSAC_*_ENABLED=false into the config-as-code-ig Secret, which makes the
  # config-as-code role drop those schedules entirely.
  projectSyncEnabled: true
  configAsCodeEnabled: true
  manifest:
    create: false
    data: {}

importAgents:
  servers: []

importBcmAgents:
  cert: ""
  key: ""

serviceAccounts:
  osacSa: "osac-sa"
  templatePublisher: "template-publisher"

apiToken:
  create: true

# Point an install at a shared AAP instance managed elsewhere. Empty values
# fall back to today's expressions (local AAP instance services, token
# secret created by the create-api-token hook in .Release.Namespace).
remote:
  rbacEnabled: false
  # ServiceAccount the shared AAP controller pods use; must be set (together
  # with controllerNamespace) when rbacEnabled is true so the RoleBinding in
  # this namespace grants the controller job-pod permissions here.
  controllerServiceAccount: ""
  controllerNamespace: ""
  # URL of the shared AAP gateway (e.g. http://osac-aap.osac-aap.svc.cluster.local)
  gatewayURL: ""
  apiTokenSecret:
    name: ""
    namespace: ""

instanceGroups:
  clusterFulfillment:
    enabled: false
    config: {}
    secret: {}
  networkFulfillment:
    enabled: false
    config: {}
    secret: {}
  storageFulfillment:
    enabled: false
    config: {}
    secret: {}
  publishTemplates:
    enabled: false
    config:
      OSAC_TEMPLATE_COLLECTIONS: ""
      OSAC_FULFILLMENT_SERVICE_URI: ""
